name: Build image
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # rebuilds every Monday = never outdated
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Reuse unchanged layers (apt, PyTorch) between builds so their digests stay the same
          # and RunPod hosts that already have them don't download them again.
          # CACHEBUST forces SwarmUI/ComfyUI to be re-cloned fresh every build.
          build-args: CACHEBUST=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/snaggleuk/509m83v89u46murjgerhrhlkthjrr94:latest
